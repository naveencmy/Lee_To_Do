name = "lee-todo-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lee-todo-db"
database_id = "YOUR_D1_DATABASE_ID"  # Replace after: npx wrangler d1 create lee-todo-db

# AI binding
[ai]
binding = "AI"

# Environment variables (set via wrangler secret put)
# VAPID_PUBLIC_KEY
# VAPID_PRIVATE_KEY
# VAPID_SUBJECT  (mailto:your@email.com)
# AI_GATEWAY_SLUG (your AI Gateway name from Cloudflare dashboard)

# Cron triggers for push notifications
[triggers]
crons = ["0 */2 * * *"]  # Every 2 hours - check & send notifications
